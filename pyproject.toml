[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass"
dynamic = ["version"]
description = "An application for managing student advising information."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "azure-storage-blob~=12.28",
    "dateparser~=1.3",
    "django~=5.2",
    "django-user-agents",
    "django-simple-history~=3.11",
    "django-userservice~=3.2",
    "django-supporttools~=3.6",
    "django-persistent-message~=1.3",
    "django-storages[google]>=1.10",
    "djangorestframework~=3.12",
    "django-person-client~=2.1",
    "uw-restclients-sws~=2.5",
    "uw-restclients-gws~=2.3",
    "uw-restclients-pws~=2.1",
    "uw-restclients-compass-visits~=0.6",
    "uw-restclients-django-utils~=2.3",
    "uw-django-saml2~=1.8",
    "uw-memcached-clients~=1.0",
    "python-dateutil",
    "chardet",
    "psycopg[c]",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["compass"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "compass/VERSION"}

[tool.ruff]
line-length = 88
exclude = [
    "compass/migrations/*",
]

[tool.ruff.lint]
extend-select = ["DTZ001", "DTZ007"]
ignore = [
    "BLE001",  # allow broad Exception catches
    "S110",    # allow try-except-pass for graceful degradation
    "UP017",   # defer UTC alias modernization
]

[tool.coverage.run]
source = ["compass"]
parallel = true
omit = [
     "compass/migrations/*",
     "compass/tests/*"
]

[tool.coverage.paths]
source = [
    "compass/",
    "/app/compass/",
]
